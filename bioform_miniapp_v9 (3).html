function title(kicker,heading,desc='',note=''){return `<div class="page-title"><div><div class="eyebrow">${kicker}</div><h1 tabindex="-1">${heading}</h1>${desc?`<p>${desc}</p>`:''}</div>${note?`<div class="caption title-note">${note}</div>`:''}</div>`}
function navHTML(){return tabs.map(([id,ico,label])=>`<button class="nav-item ${S.tab===id&&S.page==='app'?'active':''}" data-action="tab" data-tab="${id}" ${S.tab===id&&S.page==='app'?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('')}
function sidebar(){return `${brand()}<div class="eyebrow">Твоё пространство</div><nav class="side-links" aria-label="Основная навигация">${navHTML()}</nav><div class="sidebar-footer"><span class="pill"><i></i> В своём темпе</span><p class="caption">Маленькие ритуалы.<br>Больше внимания к себе.</p><button class="text-btn" data-action="info">О Bioform ${icon('i-arrow','icon-sm')}</button></div>`}
function reminder(){return S.reminders&&S.dismissedReminder!==dateKey()?`<div class="reminder">${icon('i-leaf')}<span>Найди минуту для себя. Как ты сегодня?</span><button data-action="dismiss-reminder" aria-label="Скрыть напоминание">${icon('i-close')}</button></div>`:''}
function moodChoices(){return `<div class="mood-choices" role="group" aria-label="Настроение сегодня">${moods.map(m=>`<button class="mood-button" data-action="mood" data-value="${m.id}" aria-label="${m.label}" aria-pressed="${S.moods[dateKey()]===m.id}"><span class="mood-face" aria-hidden="true">${m.emoji}</span><span>${m.label}</span></button>`).join('')}</div><p class="mood-current">${S.moods[dateKey()]?`Сегодня: ${moods.find(m=>m.id===S.moods[dateKey()]).label.toLowerCase()}. Запись сохранена.`:'Выбери то, что сейчас ближе тебе.'}</p>`}
function moodCard(full=false){return `<section class="surface mood-card ${full?'large':''}"><div class="section-head"><h2>Как ты сегодня?</h2>${icon('i-flower')}</div><p class="caption">Любое настроение — часть твоего дня.</p>${moodChoices()}${full?'':`<button class="text-btn" data-action="diary">Мой дневник ${icon('i-arrow','icon-sm')}</button>`}</section>`}
function taskRows(items=taskItems){return `<div class="task-list">${items.map(t=>`<button class="task ${completed().includes(t.id)?'done':''}" data-action="task" data-id="${t.id}" aria-pressed="${completed().includes(t.id)}"><span class="checkbox">${completed().includes(t.id)?icon('i-check'):''}</span><span class="task-copy"><strong>${t.label}</strong><small>${t.hint}</small></span><span class="task-time">${t.time}</span></button>`).join('')}</div>`}
function miniWave(m){let points=[];for(let x=0;x<=68;x+=2){const v=Math.sin((x/68)*Math.PI*1.6+daysSinceBirth(new Date())*2*Math.PI/m.period);points.push(`${x===0?'M':'L'}${x},${18-v*12}`)}return `<svg class="mini-wave" viewBox="0 0 68 36" aria-hidden="true"><line x1="0" x2="68" y1="18" y2="18"/><path d="${points.join(' ')}"/></svg>`}
function home(){const val=overall();return wrap(`${header()}${reminder()}${title('В своём ритме','В гармонии<br>с собой.')}<section class="hero">${pic('hero')}<div class="hero-copy"><div class="eyebrow">${icon('i-spark')} Твой ритм дня</div><div class="hero-score">${signed(val)}</div><p>${phase(val)} по развлекательной модели биоритмов.</p><button class="btn" data-action="tab" data-tab="rhythm">Посмотреть график ${icon('i-arrow')}</button></div></section><div class="metrics">${metrics().map(m=>`<button class="metric" style="color:${m.color}" data-action="tab" data-tab="rhythm" aria-label="${m.name} цикл: ${signed(m.value)}. Открыть график"><span class="metric-label">${icon(m.ico)} ${m.short}</span><strong>${signed(m.value)}</strong>${miniWave(m)}</button>`).join('')}</div><button class="practice-cover home-practice" data-action="practice" data-kind="breathing">${pic('breath')}<span class="eyebrow">Практика дня</span><div class="cover-bottom"><div><h2>Пауза.<br> Вдох. Выдох.</h2><p>3 минуты · время для себя</p></div><span class="round-arrow">${icon('i-play','play')}</span></div></button><div class="lower-grid"><section class="surface"><div class="section-head"><h2>Маленькие шаги</h2><button class="text-btn" data-action="tab" data-tab="plan" data-plan-count aria-label="Мой план: ${completed().length} из 4 шагов">${completed().length} / 4 ${icon('i-arrow','icon-sm')}</button></div><div class="progress-track" role="progressbar" aria-label="Задачи на сегодня" aria-valuenow="${completed().length}" aria-valuemin="0" aria-valuemax="4"><div class="progress-fill" style="width:${completed().length*25}%"></div></div>${taskRows(taskItems.slice(0,3))}</section>${moodCard()}</div><section class="bottom-banner">${icon('i-book','banner-icon')}<div class="banner-copy"><strong>Твоё пространство знаний</strong><small>Календарь, практики и материалы по месяцам</small></div><button class="icon-btn" data-action="tab" data-tab="library" aria-label="Открыть материалы">${icon('i-arrow')}</button></section><p class="footer-note">Биоритмы — развлекательная математическая модель, а не оценка здоровья или способностей.</p>`)}
function welcome(){return `<section class="welcome page-enter"><header class="welcome-top">${brand()}<span class="pill"><i></i> В своём темпе</span></header><div class="welcome-visual">${pic('hero')}<span class="eyebrow">${icon('i-spark','icon-sm')} Пространство для себя</span><div class="welcome-card-text">Маленькая пауза.<br>Большой смысл.<small>Тело · мысли · настроение</small></div></div><div class="welcome-copy"><h1 tabindex="-1">Твой день.<br>Твой ритм.<br><em>Твой баланс.</em></h1><p>Практики, личный дневник и календарь — в одном спокойном пространстве.</p><div class="welcome-actions"><button class="btn" data-action="goto" data-to="access">Начать</button></div></div></section>`}
function formTop(step,back){return `<div class="form-top"><button class="icon-btn" data-action="${editingProfile?'cancel-edit':'goto'}" data-to="${back}" aria-label="Назад">${icon('i-back')}</button>${editingProfile?'<span class="eyebrow">Мои данные</span>':`<div class="steps" aria-label="Шаг ${step} из 3">${[1,2,3].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`}</div>`}
function formArt(){return `<aside class="form-art">${pic('breath')}<h2>Найди свой<br>внутренний баланс.</h2></aside>`}


function scanner(){return wrap(`<header class="topbar"><button class="icon-btn" data-action="scan-back" aria-label="Назад">${icon('i-back')}</button>${brand()}</header><section class="scan"><div class="eyebrow">Шаг 03 · Персональный календарь</div><h1 tabindex="-1">Остановись.<br>Почувствуй момент.</h1><p class="caption">Твой ритм уже внутри.<br>Осталось познакомиться с ним.</p><div class="scan-circle"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="105"/><circle class="fill" id="scanProgress" cx="110" cy="110" r="105"/></svg><button class="scan-button" id="scanButton" aria-label="Удерживай 2 секунды для расчёта">${icon('i-finger')}</button></div><p class="scan-status" id="scanStatus" role="status">Удерживай круг около 2 секунд<br>или нажми кнопку ниже.</p><div class="scan-controls"><button class="btn full" data-action="auto-scan">Рассчитать мой ритм ${icon('i-arrow','icon-sm')}</button><p class="scan-hint">Это только анимация. Отпечаток не считывается.<br>Расчёт использует дату рождения.</p></div></section>`)}
function rhythmRows(date){return metrics(date).map(m=>`<div class="rhythm-item"><div class="row-top">${icon(m.ico)} ${m.name}</div><strong style="color:${m.color}">${signed(m.value)}</strong><small>${phase(m.value)} · цикл ${m.period} дней</small></div>`).join('')}
function rhythm(){const d=chartDate();return wrap(`${header()}${title('Персональный календарь','Твои биоритмы.','Три условных цикла, рассчитанных по дате рождения.')}<section class="surface chart-surface"><div class="chart-top"><div><h3>Динамика циклов</h3><p class="chart-caption">Выбери день на графике или ползунке</p></div><div class="month-bar"><button class="icon-btn" data-action="month-prev" aria-label="Предыдущий месяц" ${S.year===1901&&S.month===0?'disabled':''}>${icon('i-back')}</button><strong>${months[S.month]} ${S.year}</strong><button class="icon-btn" data-action="month-next" aria-label="Следующий месяц" ${S.year===2200&&S.month===11?'disabled':''}>${icon('i-chevron')}</button></div></div><div class="chart-wrap"><canvas id="biorhythmChart" role="img" aria-label="График трёх условных циклов от минус 100 до плюс 100 процентов. Значения выбранного дня приведены ниже."></canvas></div><div class="legend">${metrics().map(m=>`<span><i class="dot" style="background:${m.color}"></i>${m.short}</span>`).join('')}</div><div class="chart-date-control"><label for="chartDay">День месяца</label><input id="chartDay" type="range" min="1" max="${new Date(S.year,S.month+1,0).getDate()}" value="${S.selectedDay}" aria-valuetext="${esc(d.toLocaleDateString('ru-RU'))}"><output id="chartDayOutput" for="chartDay">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</output></div></section><section class="rhythm-details"><div class="section-head"><h2 id="selectedDateTitle">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</h2><button class="text-btn" data-action="month-today">К сегодняшнему дню ${icon('i-arrow','icon-sm')}</button></div><div class="rhythm-rows" id="rhythmRows" aria-live="polite">${rhythmRows(d)}</div></section><div class="info-row">${icon('i-info')}<span>Проценты обозначают фазу математических циклов. Они не предсказывают самочувствие, работоспособность или события.</span></div><button class="btn secondary" data-action="info">Как устроен расчёт ${icon('i-arrow','icon-sm')}</button>`)}
function practiceRow(kind){return `<button class="practice-row" data-action="practice" data-kind="${kind}">${pic(kind==='breathing'?'breath':'hero','practice-thumb')}<span class="practice-copy"><strong>${kind==='breathing'?'Пауза. Вдох. Выдох.':'Тихий вечер'}</strong><small>${kind==='breathing'?'3 минуты · визуальное дыхание':'5 минут · таймер тишины'}</small></span><span class="round-arrow">${icon('i-play','play')}</span></button>`}
function plan(){const items=taskItems.filter(t=>S.planFilter==='all'||t.kind===S.planFilter);return wrap(`${header()}${title('Маленькие ритуалы','Мой план на день.','Немного заботы о себе, без спешки и лишних ожиданий.')}<section class="surface progress-summary"><div class="progress-number">${completed().length}<span> / 4</span></div><div class="progress-copy"><strong>${completed().length===4?'Все шаги на сегодня сделаны':'Каждый маленький шаг считается'}</strong><div class="progress-track" role="progressbar" aria-label="Выполненные задачи" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${completed().length}"><div class="progress-fill" style="width:${completed().length*25}%"></div></div><p class="caption">${completed().length===4?'Можно просто насладиться этим моментом.':'Сделай столько, сколько комфортно тебе.'}</p></div></section><div class="plan-layout"><section class="surface"><div class="segmented" role="group" aria-label="Фильтр задач">${[['all','Все'],['routine','Ритуалы'],['video','Практики']].map(([id,label])=>`<button class="${S.planFilter===id?'active':''}" data-action="filter" data-filter="${id}" aria-pressed="${S.planFilter===id}">${label}</button>`).join('')}</div>${taskRows(items)}<button class="text-btn" data-action="diary">Записать мысли в дневник ${icon('i-arrow','icon-sm')}</button></section><section><div class="section-head"><h2>Минуты для себя</h2><span class="eyebrow">Практики</span></div>${practiceRow('breathing')}${practiceRow('meditation')}<div class="calm-note">${icon('i-leaf')}<p>Не обязательно успевать всё.<br>Достаточно быть здесь.</p><small>Напоминание от Bioform</small></div></section></div>`)}
function libraryRows(){const q=libraryQuery.trim().toLocaleLowerCase('ru-RU');const results=categories.filter(c=>(c.name+' '+c.sub).toLocaleLowerCase('ru-RU').includes(q));return results.length?results.map(c=>`<button class="library-row" data-action="material" data-id="${c.id}"><span class="library-icon">${icon(c.ico)}</span><span class="library-copy"><strong>${c.name}</strong><small>${c.sub}</small></span>${icon('i-chevron')}</button>`).join(''):`<div class="empty-state"><strong>Пока ничего не нашлось</strong><p>Попробуй другое название или очисти поиск.</p><button class="text-btn" data-action="clear-search">Очистить поиск ${icon('i-close','icon-sm')}</button></div>`}
function library(){return wrap(`${header()}${title('Пространство знаний','Ближе к себе.','Всё, к чему хочется вернуться. В одном месте.')}<button class="library-hero" data-action="material" data-id="year" aria-label="Открыть мой год в балансе">${pic('botanical')}<span class="card-copy"><span class="eyebrow">Твоя коллекция</span><h2>Мой год<br>в балансе.</h2><p>Персональный календарь<br>и материалы по месяцам.</p></span><span class="round-arrow">${icon('i-arrow')}</span></button><div class="library-tools"><h3>Твои материалы <span class="muted" style="font-size:12px">/ 8</span></h3><div class="search-wrap">${icon('i-search')}<label class="sr-only" for="librarySearch">Поиск материалов</label><input class="search-input" id="librarySearch" type="search" placeholder="Найти материал" maxlength="80" value="${esc(libraryQuery)}" autocomplete="off"></div></div><div class="library-grid" id="libraryResults" aria-live="polite">${libraryRows()}</div><section style="margin-top:28px"><div class="section-head"><h2>Практики всегда рядом</h2></div><div class="library-grid">${practiceRow('breathing')}${practiceRow('meditation')}</div></section><p class="footer-note">Разделы с отметкой «скоро» появятся после публикации материалов.</p>`)}
function lastWeek(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d})}
function weekMoods(){return lastWeek().map(d=>{const key=dateKey(d),m=moods.find(m=>m.id===S.moods[key]);return `<div class="week-day ${key===dateKey()?'today':''}"><span class="weekday">${d.toLocaleDateString('ru-RU',{weekday:'short'})}</span><span class="emoji" role="img" aria-label="${m?m.label:'Нет записи'}">${m?m.emoji:'·'}</span><span class="day">${String(d.getDate()).padStart(2,'0')}</span></div>`}).join('')}
function overview(){return wrap(`${header({back:true})}${title('Дневник настроения','Мой внутренний<br>прогноз.','Здесь только твои записи. Они важнее любых расчётов.')}<div class="diary-layout"><div>${moodCard(true)}<section class="surface"><div class="section-head"><h2>Настроение за неделю</h2>${icon('i-calendar')}</div><p class="caption">Последние 7 дней · без оценок и ожиданий</p><div class="week-moods" id="weekMoods">${weekMoods()}</div></section><div class="diary-stats"><div class="diary-stat"><strong data-diary-stat="moods">${lastWeek().filter(d=>S.moods[dateKey(d)]).length}<span style="font-size:18px;color:var(--muted)"> / 7</span></strong><small>дней с записью настроения</small></div><div class="diary-stat"><strong data-diary-stat="sessions">${lastWeek().reduce((n,d)=>n+(S.sessions[dateKey(d)]||0),0)}</strong><small>практик завершено за неделю</small></div></div></div><section class="surface diary-note"><div class="section-head"><h2>Мысли на сегодня</h2>${icon('i-book')}</div><p class="caption" style="margin-bottom:22px">Что порадовало? Что было непросто? Что хочется оставить в этом дне?</p><form id="notesForm"><div class="field"><label class="sr-only" for="dailyNote">Заметка за сегодня</label><textarea id="dailyNote" name="note" rows="8" maxlength="2000" placeholder="Можно начать с пары слов…">${esc(S.notes[dateKey()]||'')}</textarea></div><button class="btn full" type="submit">Сохранить и отметить в плане ${icon('i-check','icon-sm')}</button><p class="note-saved" id="noteStatus" role="status">${S.notes[dateKey()]?'Заметка сохранена в этом браузере.':'Только для тебя. Черновик сохраняется автоматически.'}</p></form><div class="calm-note"><p>Иногда лучший план —<br>прислушаться к себе.</p><small>Твой маленький ритуал</small></div></section></div>`)}
function profile(){const p=S.profile;return wrap(`${header()}${title('Личное пространство','Мой профиль.')}<div class="profile-layout"><section class="surface profile-card"><div class="avatar">${esc((p.name||'Б')[0].toUpperCase())}</div><h2>${esc(p.name||'Гость')}</h2><p class="email">${esc(p.email||'Почта не указана')}</p><span class="pill" style="margin-top:16px"><i></i> Подписка действительна</span><div class="profile-details"><div class="profile-detail"><span>Дата рождения</span><strong>${validDob(p.birth)?parseDate(p.birth).toLocaleDateString('ru-RU'):'Не указана'}</strong></div><div class="profile-detail"><span>Город</span><strong>${esc(p.city||'Не указан')}</strong></div></div><button class="btn secondary full" data-action="edit-profile">Изменить данные ${icon('i-arrow','icon-sm')}</button></section><div><section class="surface settings"><button class="setting" data-action="reminders" role="switch" aria-checked="${S.reminders}" aria-label="Напоминание внутри приложения">${icon('i-bell')}<span class="setting-copy"><strong>Мягкое напоминание</strong><small>На главной, пока приложение открыто</small></span><span class="toggle ${S.reminders?'on':''}" aria-hidden="true"></span></button><button class="setting" data-action="diary">${icon('i-book')}<span class="setting-copy"><strong>Мой дневник</strong><small>Настроение и личные заметки</small></span>${icon('i-chevron','arrow')}</button><button class="setting" data-action="info">${icon('i-info')}<span class="setting-copy"><strong>Как считается биоритм?</strong><small>О модели и её ограничениях</small></span>${icon('i-chevron','arrow')}</button><button class="setting" data-action="edit-survey">${icon('i-checklist')}<span class="setting-copy"><strong>Моя анкета</strong><small>${surveyAnswered()} из 17 ответов · посмотреть и изменить</small></span>${icon('i-chevron','arrow')}</button><button class="setting" data-action="repeat-scan">${icon('i-finger')}<span class="setting-copy"><strong>Почувствовать момент</strong><small>Повторить анимацию расчёта</small></span>${icon('i-chevron','arrow')}</button></section><section class="surface settings" style="margin-top:17px"><button class="setting" data-action="reset">${icon('i-restart')}<span class="setting-copy"><strong>Сбросить мои данные</strong><small>Анкета, записи и выполненные задачи</small></span>${icon('i-chevron','arrow')}</button></section><p class="footer-note">Bioform · версия 11.0 · Mobile<br>Данные хранятся в этом браузере. При открытии файла на другом устройстве они не переносятся автоматически.</p></div></div>`)}
function timeText(seconds){const t=Math.max(0,Math.floor(seconds));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function player(){const breath=practice.kind==='breathing',durations=breath?[60,180,300]:[180,300,420];return wrap(`${header({back:true})}<section class="player-layout"><div class="player-art">${pic(breath?'breath':'hero')}<p class="player-art-copy">Сейчас есть только<br>этот момент.</p></div><div class="player-side"><div class="eyebrow">${breath?'Визуальная практика':'Таймер тишины'}</div><h1 tabindex="-1">${breath?'Пауза.<br>Вдох. Выдох.':'Тихий вечер.'}</h1><p class="caption">${breath?'Мягкий ориентир для дыхания.<br>Дыши в комфортном для себя темпе.':'Отложи дела и побудь в тишине.<br>Эти несколько минут — только твои.'}</p><div class="player-options"><div class="segmented" role="group" aria-label="Длительность практики">${durations.map(n=>`<button class="${practice.duration===n?'active':''}" data-action="duration" data-value="${n}" aria-pressed="${practice.duration===n}">${n/60} мин</button>`).join('')}</div></div><div class="breath-display" id="breathDisplay"><strong id="breathPhase">Готов?</strong><span id="breathCount">Начни, когда захочется</span></div><div class="progress-track" id="practiceProgress" role="progressbar" aria-label="Прогресс практики" aria-valuemin="0" aria-valuemax="${practice.duration}" aria-valuenow="0"><div class="progress-fill" id="practiceProgressFill" style="width:0%"></div></div><div class="player-time"><strong id="practiceElapsed">00:00</strong><span id="practiceTotal">${timeText(practice.duration)}</span></div><div class="player-controls"><button class="icon-btn" data-action="practice-restart" aria-label="Начать заново">${icon('i-restart')}</button><button class="btn" id="practiceToggle" data-action="practice-toggle">${icon('i-play','icon-sm')} Начать</button></div><p class="player-foot"><strong>Без звука · без спешки</strong><br>${breath?'Вдох · пауза · выдох · пауза, по 4 секунды.<br>В любой момент можно остановиться.':'Можно оставить глаза открытыми.<br>Просто побудь здесь.'}</p></div></section>`)}
function modalContent(id){let title='',body='',ico='i-info',actions='',photo='';

function currentPracticeSeconds(){return Math.min(practice.duration,practice.elapsed+(practice.running?(performance.now()-practice.started)/1000:0))}
function pausePractice(){if(practice.running)practice.elapsed=currentPracticeSeconds();practice.running=false;clearInterval(practice.interval);practice.interval=null}
function startPractice(){if(practice.completed){practice.elapsed=0;practice.completed=false}practice.started=performance.now();practice.running=true;clearInterval(practice.interval);practice.interval=setInterval(updatePractice,200);updatePractice()}
function openPractice(kind){pausePractice();practice={kind:kind==='meditation'?'meditation':'breathing',duration:kind==='meditation'?300:180,elapsed:0,started:0,running:false,completed:false,interval:null};pageTo('player')}
function completePractice(){pausePractice();practice.elapsed=practice.duration;practice.completed=true;const key=dateKey();S.sessions[key]=(S.sessions[key]||0)+1;S.done[key]=[...new Set([...completed(),'practice'])];save();toast(storageOK?'Практика завершена. Шаг отмечен в плане.':'Практика завершена. Сохранение в браузере недоступно.')}
function updatePractice(){if(S.page!=='player')return;let elapsed=currentPracticeSeconds();if(elapsed>=practice.duration&&!practice.completed){completePractice();elapsed=practice.duration}const stage=$('#breathPhase'),count=$('#breathCount'),display=$('#breathDisplay');if(!stage||!count)return;let label='Готов?',sub='Начни, когда захочется',scale=1;if(practice.completed){label='Готово';sub='Спасибо за время для себя'}else if(!practice.running&&elapsed>0){label='Пауза';sub='Продолжи, когда захочешь'}else if(practice.running){if(practice.kind==='breathing'){const t=elapsed%16,index=Math.floor(t/4);label=['Вдох','Пауза','Выдох','Пауза'][index];sub=`${Math.max(1,4-Math.floor(t%4))} сек`;scale=index===0?1+(t/4)*.12:index===1?1.12:index===2?1.12-((t-8)/4)*.12:1}else{label='Будь здесь';sub='Можно никуда не спешить';scale=1+.05*Math.sin(elapsed/4)}}if(stage.textContent!==label)stage.textContent=label;count.textContent=sub;display.style.setProperty('--breath-scale',reduced()?1:scale.toFixed(3));$('#practiceElapsed').textContent=timeText(elapsed);$('#practiceTotal').textContent=timeText(practice.duration);$('#practiceProgressFill').style.width=`${elapsed/practice.duration*100}%`;$('#practiceProgress').setAttribute('aria-valuenow',Math.floor(elapsed));$('#practiceProgress').setAttribute('aria-valuemax',practice.duration);const toggle=$('#practiceToggle'),mode=practice.running?'pause':practice.completed?'again':elapsed>0?'resume':'start';if(toggle.dataset.mode!==mode){toggle.dataset.mode=mode;toggle.innerHTML=`${icon(practice.running?'i-pause':'i-play','icon-sm')} ${practice.running?'Пауза':practice.completed?'Ещё раз':elapsed>0?'Продолжить':'Начать'}`}}
function startScan(){if(scanTimer||S.page!=='scanner')return;scanStarted=performance.now();const status=$('#scanStatus');status.textContent='Вычисляем фазы твоих циклов…';scanTimer=setInterval(()=>{if(S.page!=='scanner'){stopScan();return}const progress=Math.min(1,(performance.now()-scanStarted)/1900);$('#scanProgress')?.style.setProperty('stroke-dashoffset',String(660*(1-progress)));if(progress===1){stopScan();S.month=new Date().getMonth();S.year=new Date().getFullYear();S.selectedDay=new Date().getDate();tabTo('home');toast('Твой календарь готов')}},30)}
function cancelScan(){if(!scanTimer)return;stopScan();$('#scanProgress')?.style.setProperty('stroke-dashoffset','660');const el=$('#scanStatus');if(el)el.textContent='Удерживай круг около 2 секунд или нажми кнопку ниже.'}
function attachScan(){const btn=$('#scanButton');btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();btn.setPointerCapture?.(e.pointerId);startScan()});btn.addEventListener('pointerup',cancelScan);btn.addEventListener('pointercancel',cancelScan);btn.addEventListener('lostpointercapture',cancelScan);btn.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();if(!e.repeat)startScan()}});btn.addEventListener('keyup',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();cancelScan()}});btn.addEventListener('blur',cancelScan)}
function startChart(){const start=performance.now();function frame(time){const p=reduced()?1:Math.min(1,(time-start)/750);drawChart(1-Math.pow(1-p,3));if(p<1)chartFrame=requestAnimationFrame(frame)}chartFrame=requestAnimationFrame(frame);const c=$('#biorhythmChart');if('ResizeObserver' in window){chartResize=new ResizeObserver(()=>drawChart());chartResize.observe(c)}c.addEventListener('click',e=>{const box=c.getBoundingClientRect(),days=new Date(S.year,S.month+1,0).getDate();chooseDay(Math.round((e.clientX-box.left-35)/(box.width-53)*(days-1))+1)})}
function drawChart(reveal=1){const canvas=$('#biorhythmChart');if(!canvas)return;const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height,dpr=Math.min(devicePixelRatio||1,2);if(w<1||h<1)return;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const ctx=canvas.getContext('2d');if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const L=35,R=18,T=18,B=30,pw=w-L-R,ph=h-T-B,days=new Date(S.year,S.month+1,0).getDate(),x=day=>L+(day-1)/(days-1)*pw,y=value=>T+(100-value)/200*ph;ctx.font='10px system-ui, sans-serif';ctx.lineWidth=1;ctx.textBaseline='middle';[-100,-50,0,50,100].forEach(v=>{ctx.beginPath();ctx.strokeStyle=v===0?'#798a6338':'#b3c49612';ctx.moveTo(L,y(v));ctx.lineTo(w-R,y(v));ctx.stroke();ctx.textAlign='right';ctx.fillStyle='#9ba88f';ctx.fillText(v>0?'+'+v:String(v),L-9,y(v))});ctx.textAlign='center';ctx.textBaseline='alphabetic';[1,Math.round(days/4),Math.round(days/2),Math.round(days*3/4),days].forEach(day=>{ctx.fillText(day,x(day),h-7)});const base=daysSinceBirth(new Date(S.year,S.month,1,12));metrics().forEach(m=>{ctx.save();ctx.beginPath();ctx.rect(L-2,T-4,pw*reveal+4,ph+8);ctx.clip();ctx.beginPath();ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=m.color;for(let i=0;i<=days*12;i++){const d=1+(i/(days*12))*(days-1),v=Math.sin(2*Math.PI*(base+d-1)/m.period)*100;if(i===0)ctx.moveTo(x(d),y(v));else ctx.lineTo(x(d),y(v))}ctx.stroke();ctx.restore()});const chosen=chartDate(),cx=x(S.selectedDay);ctx.save();ctx.setLineDash([3,5]);ctx.beginPath();ctx.strokeStyle='#dfedc86e';ctx.moveTo(cx,T);ctx.lineTo(cx,T+ph);ctx.stroke();ctx.restore();metrics(chosen).forEach(m=>{ctx.beginPath();ctx.fillStyle=m.color;ctx.strokeStyle='#202720';ctx.lineWidth=2;ctx.arc(cx,y(m.value),4.4,0,Math.PI*2);ctx.fill();ctx.stroke()})}
function chooseDay(day){S.selectedDay=Math.max(1,Math.min(day,new Date(S.year,S.month+1,0).getDate()));save();cancelAnimationFrame(chartFrame);const d=chartDate();$('#chartDay').value=S.selectedDay;$('#chartDay').setAttribute('aria-valuetext',d.toLocaleDateString('ru-RU'));$('#chartDayOutput').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});$('#selectedDateTitle').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});$('#rhythmRows').innerHTML=rhythmRows(d);drawChart()}

 case'subscription-next':editingProfile=false;pageTo('questionnaire');break;

 case'survey-prev':if(S.onboarding.index>0){S.onboarding.index--;save();updateSurvey({questionChanged:true})}break;
 case'edit-survey':editingSurvey=true;S.onboarding.index=0;pageTo('survey');break;

 case'tab':tabTo(el.dataset.tab);break;

 case'close-modal':closeModal();break;

 case'cancel-edit':editingProfile=false;tabTo('profile');break;
