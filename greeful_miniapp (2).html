function survey(){

function resetSwipeCard(){

function releaseSwipePointer(gesture){

}

function cancelSurveyInteraction(){

function updateSurvey({questionChanged=false}={}){

  if(!swipeGuideOpen)$('#surveyQuestion')?.focus({preventScroll:true});

 const answered=surveyAnswered();$('#surveyCount').textContent=`${answered} из 17 ответов`;$('#surveyProgress').setAttribute('aria-valuenow',answered);$('#surveyProgress>span').style.width=`${answered/17*100}%`;
 $$('[data-action="survey-answer"]').forEach(button=>{button.setAttribute('aria-pressed',button.dataset.value===answer);button.disabled=surveySwipeBusy||swipeGuideOpen});
 $('[data-action="survey-prev"]').disabled=S.onboarding.index===0||surveySwipeBusy||swipeGuideOpen;
 $('#surveySaved').textContent=surveyAnswerValid(answer)?`Ваш ответ: «${answer}». ${storageOK?'Сохранено.':'Доступен до закрытия страницы.'} Можно изменить.`:'Свайпните карточку или нажмите на ответ.';
}

function answerSurvey(value){
 if(S.page!=='survey'||swipeGuideOpen||surveySwipeBusy||swipeGesture||!surveyAnswerValid(value))return;
 const index=S.onboarding.index,q=SURVEY_QUESTIONS[index],card=$('#questionCard');if(!card)return;
 surveySwipeBusy=true;S.onboarding.answers[q.field]=value;save();updateSurvey();

  swipeTimer=0;surveySwipeBusy=false;

}

function surveyNext(){
 if(S.page!=='survey'||swipeGuideOpen||surveySwipeBusy)return;

function surveyPrevious(){

function swipeThreshold(width){return Math.max(68,Math.min(112,width*.27))}

function paintSwipe(card,x,y){
 const width=card.getBoundingClientRect().width||320,progress=Math.min(1,Math.abs(x)/swipeThreshold(width));
 card.style.transform=`translate3d(${x}px,${Math.max(-28,Math.min(28,y*.12))}px,0) rotate(${Math.max(-17,Math.min(17,x/width*18))}deg)`;
 card.style.setProperty('--swipe-yes',x>0?progress:'0');card.style.setProperty('--swipe-no',x<0?progress:'0');
}

function swipePointerDown(event){
 if(S.page!=='survey'||swipeGuideOpen||surveySwipeBusy||swipeGesture||event.isPrimary===false||(event.pointerType==='mouse'&&event.button!==0))return;

 card.classList.remove('swipe-arrive');
 swipeGesture={id:event.pointerId,card,index:S.onboarding.index,startX:event.clientX,startY:event.clientY,x:0,y:0,locked:false,samples:[{x:event.clientX,t:event.timeStamp}]};
}

function swipePointerMove(event){

 if(!gesture.locked){
  if(Math.max(Math.abs(x),Math.abs(y))<9)return;
  if(Math.abs(y)>Math.abs(x)*1.12){swipeGesture=null;return}
  if(Math.abs(x)<Math.abs(y)*1.05)return;

  try{gesture.card.setPointerCapture(event.pointerId)}catch(_){}
 }

 gesture.samples.push({x:event.clientX,t:event.timeStamp});gesture.samples=gesture.samples.filter(sample=>event.timeStamp-sample.t<=100);

function attachScan(){const btn=$('#scanButton');btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();btn.setPointerCapture?.(e.pointerId);startScan()});btn.addEventListener('pointerup',cancelScan);btn.addEventListener('pointercancel',cancelScan);btn.addEventListener('lostpointercapture',cancelScan);btn.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();if(!e.repeat)startScan()}});btn.addEventListener('keyup',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();cancelScan()}});btn.addEventListener('blur',cancelScan)}
function startChart(){const start=performance.now();function frame(time){const p=reduced()?1:Math.min(1,(time-start)/750);drawChart(1-Math.pow(1-p,3));if(p<1)chartFrame=requestAnimationFrame(frame)}chartFrame=requestAnimationFrame(frame);const c=$('#biorhythmChart');if('ResizeObserver' in window){chartResize=new ResizeObserver(()=>drawChart());chartResize.observe(c)}c.addEventListener('click',e=>{const box=c.getBoundingClientRect(),days=new Date(S.year,S.month+1,0).getDate();chooseDay(Math.round((e.clientX-box.left-35)/(box.width-53)*(days-1))+1)})}
function drawChart(reveal=1){const canvas=$('#biorhythmChart');if(!canvas)return;const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height,dpr=Math.min(devicePixelRatio||1,2);if(w<1||h<1)return;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const ctx=canvas.getContext('2d');if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const L=35,R=18,T=18,B=30,pw=w-L-R,ph=h-T-B,days=new Date(S.year,S.month+1,0).getDate(),x=day=>L+(day-1)/(days-1)*pw,y=value=>T+(100-value)/200*ph;ctx.font='10px system-ui, sans-serif';ctx.lineWidth=1;ctx.textBaseline='middle';[-100,-50,0,50,100].forEach(v=>{ctx.beginPath();ctx.strokeStyle=v===0?'#798a6338':'#b3c49612';ctx.moveTo(L,y(v));ctx.lineTo(w-R,y(v));ctx.stroke();ctx.textAlign='right';ctx.fillStyle='#9ba88f';ctx.fillText(v>0?'+'+v:String(v),L-9,y(v))});ctx.textAlign='center';ctx.textBaseline='alphabetic';[1,Math.round(days/4),Math.round(days/2),Math.round(days*3/4),days].forEach(day=>{ctx.fillText(day,x(day),h-7)});const base=daysSinceBirth(new Date(S.year,S.month,1,12));metrics().forEach(m=>{ctx.save();ctx.beginPath();ctx.rect(L-2,T-4,pw*reveal+4,ph+8);ctx.clip();ctx.beginPath();ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=m.color;for(let i=0;i<=days*12;i++){const d=1+(i/(days*12))*(days-1),v=Math.sin(2*Math.PI*(base+d-1)/m.period)*100;if(i===0)ctx.moveTo(x(d),y(v));else ctx.lineTo(x(d),y(v))}ctx.stroke();ctx.restore()});const chosen=chartDate(),cx=x(S.selectedDay);ctx.save();ctx.setLineDash([3,5]);ctx.beginPath();ctx.strokeStyle='#dfedc86e';ctx.moveTo(cx,T);ctx.lineTo(cx,T+ph);ctx.stroke();ctx.restore();metrics(chosen).forEach(m=>{ctx.beginPath();ctx.fillStyle=m.color;ctx.strokeStyle='#202720';ctx.lineWidth=2;ctx.arc(cx,y(m.value),4.4,0,Math.PI*2);ctx.fill();ctx.stroke()})}
function chooseDay(day){S.selectedDay=Math.max(1,Math.min(day,new Date(S.year,S.month+1,0).getDate()));save();cancelAnimationFrame(chartFrame);const d=chartDate();$('#chartDay').value=S.selectedDay;$('#chartDay').setAttribute('aria-valuetext',d.toLocaleDateString('ru-RU'));$('#chartDayOutput').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});$('#selectedDateTitle').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});$('#rhythmRows').innerHTML=rhythmRows(d);drawChart()}

 case'confirm-reset':closeModal(false);cleanup();cancelEntryAnimation();cancelSetupAnimation();editingSurvey=false;try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(LEGACY_STORAGE_KEY)}catch(_){}S=fresh();editingProfile=false;libraryQuery='';lastDate=dateKey();render({focus:true});toast('Данные сброшены');break;

function birthDigits(value){return String(value).replace(/\D/g,'').slice(0,8)}
function formatBirthDigits(value){const digits=birthDigits(value);return[digits.slice(0,2),digits.slice(2,4),digits.slice(4,8)].filter(Boolean).join('.')}
function caretAfterDigits(value,count){if(count<=0)return 0;let digits=0;for(let i=0;i<value.length;i++){if(/\d/.test(value[i])&&++digits===count)return i+1}return value.length}

function animateFieldFeedback(field,state,message){
 const feedback=field?.querySelector('.field-feedback');if(!feedback)return;
 const previous=feedback.dataset.feedbackState||'neutral';
 if(feedback.dataset.feedbackText!==message){
  feedback.dataset.feedbackText=message;
  if((state==='valid'||state==='invalid')&&previous!==state&&!reduced())feedback.animate?.([{opacity:.35,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'ease-out'});
 }

}

function birthBeforeInput(event){

 const start=input.selectionStart,end=input.selectionEnd;if(start!==end||start===null)return;

 if(!(backward&&input.value[start-1]==='.')&&!(forward&&input.value[start]==='.'))return;
 event.preventDefault();const digits=birthDigits(input.value),before=birthDigits(input.value.slice(0,start)).length,index=backward?before-1:before;
 input.value=formatBirthDigits(digits.slice(0,index)+digits.slice(index+1));const cursor=caretAfterDigits(input.value,backward?before-1:before);input.setSelectionRange?.(cursor,cursor);validateBirth();

const fieldTouched=new Set();
const birthIds=['birthInput'];
const fieldHints={username:'Как к вам обращаться?',email:'Например, name@example.com',editEmail:'Например, name@example.com',city:'Можно оставить пустым.'};
const monthAliases=[['январь','января','янв'],['февраль','февраля','фев'],['март','марта','мар'],['апрель','апреля','апр'],['май','мая'],['июнь','июня','июн'],['июль','июля','июл'],['август','августа','авг'],['сентябрь','сентября','сен','сент'],['октябрь','октября','окт'],['ноябрь','ноября','ноя'],['декабрь','декабря','дек']];

function fieldResult(id,value){
 const text=String(value).trim();
 if(id==='username'){if(!text)return{valid:false,message:'Введите имя, которым к вам обращаться.'};if(normalizeName(text).length<2)return{valid:false,message:'Добавьте хотя бы ещё один символ.'};if(normalizeName(text).length>50)return{valid:false,message:'Имя должно быть не длиннее 50 символов.'};return{valid:true,message:'Так и будем к вам обращаться.'}}
 if(id==='email'||id==='editEmail'){if(!text)return{valid:false,message:'Введите вашу электронную почту.'};if(/\s/.test(text))return{valid:false,message:'Уберите пробелы внутри адреса.'};if(!text.includes('@'))return{valid:false,message:'Добавьте @ и домен, например name@example.com.'};if(!emailFormatValid(text))return{valid:false,message:'Проверьте адрес. Например: name@example.com.'};return{valid:true,message:'Формат почты верный.'}}
 if(id==='city'){if(text.length>70)return{valid:false,message:'Название должно быть не длиннее 70 символов.'};return{valid:true,empty:!text,message:text?'Город указан.':'Можно оставить пустым.'}}

}

function paintField(id,state,message){
 const input=$('#'+id),field=$('#'+id+'Field'),feedback=$('#'+id+'Feedback');if(!input||!field||!feedback)return;
 field.dataset.state=state;
 if(state==='invalid')input.setAttribute('aria-invalid','true');else input.removeAttribute('aria-invalid');
 animateFieldFeedback(field,state,message);if(feedback.textContent!==message)feedback.textContent=message;
}

function validateField(id,{force=false}={}){
 const input=$('#'+id);if(!input)return true;
 const result=fieldResult(id,input.value),showError=force||fieldTouched.has(id);
 paintField(id,result.valid?(result.empty?'neutral':'valid'):showError?'invalid':'neutral',result.valid?result.message:showError?result.message:fieldHints[id]);
 return result.valid;
}

function datePartsResult(dayText,monthText,yearText,today=dateKey()){
 const d=String(dayText).trim(),m=String(monthText).trim(),y=String(yearText).trim(),errors={};
 const day=Number(d),month=monthNumber(m),year=Number(y),currentYear=Number(today.slice(0,4));
 if(!d)errors.birthDay='Введите день рождения.';
 else if(!/^\d{1,2}$/.test(d)||day<1||day>31)errors.birthDay='День — число от 1 до 31.';
 if(!m)errors.birthMonth='Введите месяц рождения.';
 else if(!Number.isInteger(month)||month<1||month>12)errors.birthMonth='Месяц — число от 1 до 12.';
 if(!y)errors.birthYear='Введите год рождения.';
 else if(!/^\d{4}$/.test(y))errors.birthYear='Введите год полностью: 4 цифры.';
 else if(year<1901)errors.birthYear='Введите год от 1901.';
 else if(year>currentYear)errors.birthYear='Дата рождения не может быть в будущем.';
 if(!Object.keys(errors).length){
  const daysInMonth=new Date(year,month,0).getDate();
  if(day>daysInMonth)errors.birthDay=`В этом месяце ${daysInMonth} ${daysInMonth===31?'день':'дней'}. Проверьте день рождения.`;
 }
 const value=`${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
 if(!Object.keys(errors).length&&value>today){errors.birthDay='Дата рождения не может быть в будущем.';errors.birthMonth=errors.birthDay}
 return{valid:!Object.keys(errors).length,value:Object.keys(errors).length?'':value,errors,complete:!!d&&!!m&&y.length===4};
}

function readBirth(){
 const digits=birthDigits($('#birthInput')?.value||'');
 const result=datePartsResult(digits.slice(0,2),digits.slice(2,4),digits.slice(4,8));
 if(!result.valid){const message=digits.length<8?'Введи дату целиком — 8 цифр: день, месяц и год.':Object.values(result.errors)[0];return{...result,errors:{birthInput:message},complete:digits.length===8}}

}

function validateBirth({force=false}={}){
 const result=readBirth(),field=$('#birthField'),feedback=$('#birthFeedback'),input=$('#birthInput');if(!field||!feedback||!input)return result;
 const showError=!result.valid&&(force||fieldTouched.has('birthInput')||result.complete),state=result.valid?'valid':showError?'invalid':'neutral';
 field.dataset.state=state;
 if(showError)input.setAttribute('aria-invalid','true');else input.removeAttribute('aria-invalid');
 const message=result.valid?`${parseDate(result.value).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})} — всё верно.`:showError?result.errors.birthInput:'Точки появятся автоматически.';
 animateFieldFeedback(field,state,message);if(feedback.textContent!==message)feedback.textContent=message;
 const hidden=$('#birth');if(hidden)hidden.value=result.value;
 return result;
}

function fullDateParts(text){
 const value=text.trim();let match=value.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);if(match)return[match[3],match[2],match[1]];
 match=value.match(/^(\d{1,2})[.\s/\-]+(\d{1,2})[.\s/\-]+(\d{4})$/);if(match)return[match[1],match[2],match[3]];
 match=value.match(/^(\d{2})(\d{2})(\d{4})$/);return match?[match[1],match[2],match[3]]:null;
}

function formInput(event){
 const input=event.target;if(event.isComposing)return;
 if(input.id==='birthInput'){
  if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(input.value)){const parts=fullDateParts(input.value);if(parts)input.value=parts.map((part,index)=>index<2?part.padStart(2,'0'):part).join('.')}
  maskBirthInput(input);validateBirth();return;
 }
 if(Object.hasOwn(fieldHints,input.id))validateField(input.id);
}

function formBlur(event){
 const input=event.target,id=input.id;
 if(id==='birthInput'){fieldTouched.add(id);maskBirthInput(input);validateBirth();return}
 if(Object.hasOwn(fieldHints,id)){input.value=id==='username'?normalizeName(input.value):input.value.trim();fieldTouched.add(id);validateField(id)}
}

function formPaste(event){
 if(event.target.id!=='birthInput')return;
 const text=event.clipboardData?.getData('text')||'',parts=fullDateParts(text);if(!parts)return;
 event.preventDefault();const input=event.target;input.value=parts.map((part,index)=>index<2?part.padStart(2,'0'):part).join('.');fieldTouched.add('birthInput');validateBirth({force:true});input.setSelectionRange?.(input.value.length,input.value.length);
}

function formKeydown(event){

 const next={username:'birthInput',birthInput:'city',...(editingProfile?{city:'editEmail'}:{})}[event.target.id];

const emotionStates=new Map();
const moodIndex=()=>{const found=moods.findIndex(m=>m.id===S.moods[dateKey()]);return found<0?moods.length-1:found};
const moodAvailable=()=>!S.modal&&(S.page==='overview'||(S.page==='app'&&S.tab==='home'));
const emotionDate=()=>new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const emotionStatus=()=>S.moods[dateKey()]?(storageOK?'Отметка сохранена. Можно изменить.':'Отметка доступна до закрытия страницы.'):'Листай или нажми на свою эмоцию.';

function moodChoices(scope='home'){
 const selected=moodIndex(),saved=S.moods[dateKey()];
 return `<div class="emotion-title" data-emotion-title>${moods[selected].label}</div><div class="emotion-carousel native" data-mood-carousel role="radiogroup" aria-label="Эмоция на сегодня" aria-describedby="${scope}EmotionHint"><span class="emotion-spacer" aria-hidden="true"></span>${Array.from({length:3},(_,copy)=>moods.map((m,index)=>`<button type="button" class="emotion-option" data-action="mood" data-value="${m.id}" data-copy="${copy}" role="radio" aria-label="${m.label}" aria-checked="${copy===1&&saved===m.id}" ${copy===1?'':'aria-hidden="true"'} tabindex="${copy===1&&selected===index?'0':'-1'}"><span class="emotion-sphere">${emotionFace(m.id)}</span></button>`).join('')).join('')}<span class="emotion-spacer" aria-hidden="true"></span></div><div class="emotion-dots" aria-hidden="true">${moods.map((m,index)=>`<span data-emotion-dot="${m.id}" class="${index===selected?'active':''}"></span>`).join('')}</div><p class="emotion-status" id="${scope}EmotionHint" data-emotion-status role="status">${emotionStatus()}</p>`;
}

function measureMoodCarousel(state){
 state.width=state.el.clientWidth||state.el.getBoundingClientRect().width;
 state.centers=state.buttons.map(button=>button.offsetLeft+button.offsetWidth/2);
 state.step=state.centers[1]-state.centers[0]||100;
}

function nearestMood(state){
 const center=state.el.scrollLeft+state.width/2;let index=0,distance=Infinity;
 state.centers.forEach((value,i)=>{const d=Math.abs(value-center);if(d<distance){distance=d;index=i}});
 return{index,id:Number(state.buttons[index].dataset.value),distance};
}

function paintMoodCarousel(state){
 if(!emotionStates.has(state.el))return;
 const center=state.el.scrollLeft+state.width/2,nearest=nearestMood(state);
 state.buttons.forEach((button,index)=>{
  const distance=Math.min(2.25,Math.abs(state.centers[index]-center)/state.step);
  const scale=(1-distance*.235).toFixed(3),opacity=(1-distance*.34).toFixed(3),signature=scale+':'+opacity;
  if(button.dataset.visual!==signature){button.dataset.visual=signature;button.style.setProperty('--emotion-scale',scale);button.style.setProperty('--emotion-opacity',opacity)}
  button.classList.toggle('is-far',distance>1.5);
 });
 if(state.preview!==nearest.id){
  state.preview=nearest.id;state.card.dataset.tone=String(nearest.id);
  const title=state.card.querySelector('[data-emotion-title]');if(title)title.textContent=moods.find(m=>m.id===nearest.id).label;
  state.card.querySelectorAll('[data-emotion-dot]').forEach(dot=>dot.classList.toggle('active',Number(dot.dataset.emotionDot)===nearest.id));
 }
}

function queueMoodPaint(state){if(state.frame)return;state.frame=requestAnimationFrame(()=>{state.frame=0;paintMoodCarousel(state)})}

function jumpMoodTo(state,index){
 const left=Math.max(0,state.centers[index]-state.width/2);
 state.el.scrollLeft=left;state.lastLeft=left;paintMoodCarousel(state);
}

function scrollMoodTo(state,id,{animate=false,nearest=false}={}){
 let index=state.buttons.findIndex(button=>button.dataset.copy==='1'&&Number(button.dataset.value)===id);
 if(nearest){const center=state.el.scrollLeft+state.width/2;let distance=Infinity;state.buttons.forEach((button,i)=>{if(Number(button.dataset.value)===id&&Math.abs(state.centers[i]-center)<distance){distance=Math.abs(state.centers[i]-center);index=i}})}
 if(index<0)return;
 state.userIntent=false;state.programmatic=id;state.didScroll=false;
 const left=Math.max(0,state.centers[index]-state.width/2);
 if(animate&&!reduced()&&typeof state.el.scrollTo==='function')state.el.scrollTo({left,behavior:'smooth'});else jumpMoodTo(state,index);
 scheduleMoodSettle(state);
}

function recordMood(id){
 if(!moodAvailable()||!moods.some(m=>m.id===id))return false;
 if(S.moods[dateKey()]===id)return false;
 S.moods[dateKey()]=id;save();return true;
}

function updateMoodUI({animate=false,origin=null}={}){
 const id=moods[moodIndex()].id,saved=S.moods[dateKey()];
 $$('[data-emotion-picker]').forEach(card=>{
  card.querySelectorAll('.emotion-option').forEach(button=>{const canonical=button.dataset.copy==='1',selected=Number(button.dataset.value)===id;button.setAttribute('aria-checked',canonical&&Number(button.dataset.value)===saved);button.tabIndex=canonical&&selected?0:-1});
  const status=card.querySelector('[data-emotion-status]');if(status&&status.textContent!==emotionStatus())status.textContent=emotionStatus();
  const date=card.querySelector('[data-emotion-date]');if(date)date.textContent=emotionDate();
  const el=card.querySelector('[data-mood-carousel]'),state=emotionStates.get(el);
  if(state&&el!==origin)scrollMoodTo(state,id,{animate,nearest:animate});else if(state)paintMoodCarousel(state);
 });
 const week=$('#weekMoods');if(week)week.innerHTML=weekMoods();
 $$('[data-diary-stat]').forEach(el=>{if(el.dataset.diaryStat==='moods')el.innerHTML=`${lastWeek().filter(d=>S.moods[dateKey(d)]).length}<span style="font-size:18px;color:var(--muted)"> / 7</span>`;else el.textContent=lastWeek().filter(d=>(S.notes[dateKey(d)]||'').trim()).length});
}

function selectMood(value,{focus=false,carousel=null}={}){
 const id=Number(value);if(!moodAvailable()||!moods.some(m=>m.id===id))return;
 const changed=recordMood(id);updateMoodUI({animate:true});
 const state=emotionStates.get(carousel);if(state){state.focusAfter=focus;if(changed&&!reduced()){const sphere=state.buttons.find(button=>button.dataset.copy==='1'&&Number(button.dataset.value)===id)?.querySelector('.emotion-sphere');sphere?.animate?.([{filter:'brightness(1)'},{filter:'brightness(1.12)'},{filter:'brightness(1)'}],{duration:320})}}
}

function activateMood(button){
 const carousel=button.closest('[data-mood-carousel]'),state=emotionStates.get(carousel);
 if(state?.suppressClick)return;
 selectMood(button.dataset.value,{focus:true,carousel});
}

function finishMoodScroll(state){
 if(!emotionStates.has(state.el)||state.touching||state.mouse)return;
 clearTimeout(state.timer);state.timer=0;
 let closest=nearestMood(state);
 if(!state.userIntent&&state.programmatic&&closest.id!==state.programmatic){const target=state.buttons.findIndex(button=>button.dataset.copy==='1'&&Number(button.dataset.value)===state.programmatic);jumpMoodTo(state,target);closest=nearestMood(state)}
 if(state.userIntent&&state.didScroll&&state.day===dateKey()&&moodAvailable()){
  recordMood(closest.id);updateMoodUI({origin:state.el});
 }
 state.userIntent=false;state.programmatic=null;state.didScroll=false;state.el.classList.remove('is-scrolling');
 const canonical=state.buttons.findIndex(button=>button.dataset.copy==='1'&&Number(button.dataset.value)===closest.id);
 if(closest.index!==canonical)jumpMoodTo(state,canonical);else paintMoodCarousel(state);
 if(state.focusAfter){state.buttons[canonical]?.focus({preventScroll:true});state.focusAfter=false}
 clearTimeout(state.clickTimer);state.clickTimer=setTimeout(()=>{state.suppressClick=false;state.clickTimer=0},250);
}

function scheduleMoodSettle(state){clearTimeout(state.timer);state.timer=setTimeout(()=>finishMoodScroll(state),170)}

function moodScroll(state){
 const delta=Math.abs(state.el.scrollLeft-state.lastLeft);state.lastLeft=state.el.scrollLeft;
 if(delta>.5){state.el.classList.add('is-scrolling');if(state.userIntent){state.didScroll=true;state.suppressClick=true}}
 queueMoodPaint(state);scheduleMoodSettle(state);
}

function beginMoodIntent(state){
 clearTimeout(state.timer);clearTimeout(state.clickTimer);state.userIntent=true;state.programmatic=null;state.day=dateKey();state.didScroll=false;state.suppressClick=false;state.lastLeft=state.el.scrollLeft;
}

function moodTouchStart(state,event){if(!moodAvailable())return;beginMoodIntent(state);state.touching=event.touches?.length||1}
function moodTouchEnd(state,event){state.touching=event.touches?.length||0;if(!state.touching)scheduleMoodSettle(state)}
function moodTouchCancel(state){state.touching=0;state.userIntent=false;state.didScroll=false;scrollMoodTo(state,moods[moodIndex()].id);state.el.classList.remove('is-scrolling')}

function moodMouseDown(state,event){
 if(!moodAvailable()||event.pointerType!=='mouse'||event.button!==0)return;
 beginMoodIntent(state);state.mouse={id:event.pointerId,x:event.clientX,left:state.el.scrollLeft,moved:false};
}
function moodMouseMove(state,event){
 const mouse=state.mouse;if(!mouse||mouse.id!==event.pointerId)return;
 const dx=event.clientX-mouse.x;if(!mouse.moved&&Math.abs(dx)<5)return;
 if(!mouse.moved){mouse.moved=true;state.el.classList.add('is-mouse-dragging');try{state.el.setPointerCapture(event.pointerId)}catch(_){}}
 event.preventDefault();state.el.scrollLeft=mouse.left-dx;moodScroll(state);
}
function moodMouseEnd(state,event){
 const mouse=state.mouse;if(!mouse||mouse.id!==event.pointerId)return;
 state.mouse=null;state.el.classList.remove('is-mouse-dragging');try{if(state.el.hasPointerCapture?.(event.pointerId))state.el.releasePointerCapture(event.pointerId)}catch(_){}
 if(mouse.moved){state.suppressClick=true;const closest=nearestMood(state);state.el.scrollTo?.({left:state.centers[closest.index]-state.width/2,behavior:reduced()?'auto':'smooth'});scheduleMoodSettle(state)}
}

function moodKeydown(event){
 if(!moodAvailable()||event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
 const carousel=event.target?.closest?.('[data-mood-carousel]');if(!carousel)return;
 const direction={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[event.key];
 if(direction){event.preventDefault();selectMood(moods[(moodIndex()+direction+moods.length)%moods.length].id,{focus:true,carousel})}
 else if(event.key==='Home'||event.key==='End'){event.preventDefault();selectMood(event.key==='Home'?moods[0].id:moods.at(-1).id,{focus:true,carousel})}
}

function initializeMoodCarousels(){
 $$('[data-mood-carousel]').forEach(el=>{
  if(emotionStates.has(el))return;
  const card=el.closest('[data-emotion-picker]'),buttons=[...el.querySelectorAll('.emotion-option')];if(!card||!buttons.length)return;
  const state={el,card,buttons,centers:[],step:100,width:0,preview:0,frame:0,timer:0,clickTimer:0,touching:0,mouse:null,userIntent:false,programmatic:null,didScroll:false,lastLeft:0,suppressClick:false,day:dateKey(),listeners:[],resize:null};emotionStates.set(el,state);
  const on=(type,handler,options)=>{el.addEventListener(type,handler,options);state.listeners.push([type,handler,options])};
  on('scroll',()=>moodScroll(state),{passive:true});on('scrollend',()=>finishMoodScroll(state));
  on('touchstart',event=>moodTouchStart(state,event),{passive:true});on('touchend',event=>moodTouchEnd(state,event),{passive:true});on('touchcancel',()=>moodTouchCancel(state),{passive:true});
  on('wheel',event=>{if(Math.abs(event.deltaX)>Math.abs(event.deltaY)||event.shiftKey){if(!state.userIntent)beginMoodIntent(state)}},{passive:true});
  on('pointerdown',event=>moodMouseDown(state,event));on('pointermove',event=>moodMouseMove(state,event));on('pointerup',event=>moodMouseEnd(state,event));on('pointercancel',event=>moodMouseEnd(state,event));
  measureMoodCarousel(state);scrollMoodTo(state,moods[moodIndex()].id);el.dataset.ready='true';
  if(typeof ResizeObserver==='function'){state.resize=new ResizeObserver(()=>{if(!emotionStates.has(el))return;measureMoodCarousel(state);scrollMoodTo(state,moods[moodIndex()].id)});state.resize.observe(el)}
 });
}

function cancelMoodInteraction(){
 for(const state of emotionStates.values()){
  clearTimeout(state.timer);clearTimeout(state.clickTimer);cancelAnimationFrame(state.frame);state.resize?.disconnect();
  state.listeners.forEach(([type,handler,options])=>state.el.removeEventListener(type,handler,options));
  if(state.mouse)try{state.el.releasePointerCapture(state.mouse.id)}catch(_){}
 }
 emotionStates.clear();
}
document.addEventListener('keydown',moodKeydown);
window.addEventListener('resize',()=>{for(const state of emotionStates.values()){if(!state.resize){measureMoodCarousel(state);scrollMoodTo(state,moods[moodIndex()].id)}}});

 const faces={
  1:'<ellipse cx="35" cy="43" rx="3.2" ry="4.1"/><ellipse cx="65" cy="43" rx="3.2" ry="4.1"/><path d="M36 67q14-16 28 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="m28 33 10 2m24 0 10-2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  2:'<path d="M28 42q7 5 14 0m16 0q7 5 14 0" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="50" cy="65" rx="6.5" ry="7.5"/>',
  3:'<ellipse cx="35" cy="42" rx="3.4" ry="4.2"/><ellipse cx="65" cy="42" rx="3.4" ry="4.2"/><path d="M39 64h22" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  4:'<path d="M27 42q7 7 14 0m18 0q7 7 14 0M38 61q12 11 24 0" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/>',
  5:'<path d="M29 42q2-11 10-5m22 0q8-6 10 5" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M32 57q18 8 36 0c-2 22-32 24-36 0Z"/>'
 };
 return `<svg class="emotion-face" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">${faces[id]||faces[3]}</svg>`;
}

function moodCard(full=false){
 return `<section class="surface emotion-card ${full?'large':''}" data-emotion-picker data-tone="${moods[moodIndex()].id}"><div class="emotion-top"><span class="emotion-eyebrow">Эмоция дня</span>${icon('i-flower')}</div><h2 class="emotion-prompt">Как ты сегодня?</h2>${moodChoices(full?'diary':'home')}<div class="emotion-footer">${full?`<span class="emotion-day">${icon('i-calendar')}<span>Сегодня, <span data-emotion-date>${emotionDate()}</span></span></span>`:`<button class="emotion-entry" data-action="diary"><span>Запись за сегодня</span>${icon('i-arrow')}</button>`}</div></section>`;
}

function weekMoods(){return lastWeek().map(d=>{const key=dateKey(d),m=moods.find(m=>m.id===S.moods[key]);return `<div class="week-day ${key===dateKey()?'today':''}"><span class="weekday">${d.toLocaleDateString('ru-RU',{weekday:'short'})}</span><span class="week-emotion ${m?'':'is-empty'}" role="img" aria-label="${m?m.label:'Нет записи'}">${m?emotionFace(m.id):'·'}</span><span class="day">${String(d.getDate()).padStart(2,'0')}</span></div>`}).join('')}

bootstrap();
})();
